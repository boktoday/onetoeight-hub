<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3D2820">
<meta name="robots" content="noindex, nofollow">
<title>AI Chat History — onetoeight</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--terracotta:#A46447;--almond:#CEB59E;--sage:#88937B;--umber:#4C362D;--cream:#F5F0E8;--ink:#2a2520;--muted:#7a6657;--line:rgba(76,54,45,.10);--radius:16px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;font-size:16px;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--terracotta);text-decoration:none}
button{cursor:pointer;font:inherit;border:0;outline:0}

/* ===== TOP BAR ===== */
.topbar{flex-shrink:0;background:linear-gradient(180deg,#3D2820,#4C362D);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:48px}
.topbar h1{font-family:Fraunces,serif;font-size:1rem;font-weight:600;color:#fff;margin:0;flex:1}
.topbar .sub{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(232,225,213,.7)}
.topbar .btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar .btn-text{width:auto;padding:0 12px;height:32px;border-radius:999px;font-size:.75rem;font-weight:700}

/* ===== MAIN CONTENT ===== */
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 calc(12px + var(--safe-bottom))}

/* ===== SESSION LIST ===== */
#sessionList{padding:12px}
#sessionList h2{font-family:Fraunces,serif;font-size:1.1rem;color:var(--umber);margin:0 0 8px}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .icon{font-size:2.5rem;margin-bottom:12px;display:block}
.empty-state h2{font-family:Fraunces,serif;font-size:1.2rem;color:var(--umber);margin:0 0 8px}
.empty-state p{font-size:.88rem;color:var(--muted);max-width:28ch;margin:0 auto 16px;line-height:1.5}
.empty-state .btn-primary{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--terracotta);color:#fff;border-radius:999px;font-weight:700;font-size:.9rem}

.session-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(76,54,45,.04);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.session-card:active{transform:scale(.98);box-shadow:0 1px 4px rgba(76,54,45,.04)}
.session-card .date{font-size:.68rem;font-weight:700;color:var(--sage);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.session-card .preview{font-size:.85rem;color:var(--ink);line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.session-card .meta{font-size:.72rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.session-card .meta span{display:inline-flex;align-items:center;gap:3px}
.session-card .delete-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:6px;background:transparent;color:var(--muted);font-size:.9rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.session-card:hover .delete-btn,.session-card:active .delete-btn{opacity:1}
.delete-btn:hover{background:rgba(164,100,71,.1);color:var(--terracotta)}

/* ===== CHAT VIEW ===== */
#chatView{display:none;flex-direction:column;height:100%}
#chatView.active{display:flex}
#chatHeader{flex-shrink:0;background:linear-gradient(180deg,#3D2820,#4C362D);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:48px}
#chatHeader h1{font-family:Fraunces,serif;font-size:.95rem;font-weight:600;color:#fff;margin:0;flex:1}
#chatHeader .sub{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(232,225,213,.7)}
#chatMessages{flex:1;overflow-y:auto;padding:8px 12px 4px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:10px 12px;border-radius:14px;font-size:.88rem;line-height:1.5;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}}
.msg.user{align-self:flex-end;background:var(--terracotta);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink)}
.msg .copy-btn{display:none;float:right;font-size:.6rem;color:var(--sage);background:transparent;border:0;cursor:pointer;margin-left:6px;padding:1px 4px;border-radius:3px}
.msg.assistant:hover .copy-btn,.msg.assistant:active .copy-btn{display:inline-block}

/* ===== CONFIRM DIALOG ===== */
#confirmOverlay{position:fixed;inset:0;z-index:999;background:rgba(45,28,20,.7);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
#confirmOverlay.active{display:flex}
#confirmBox{background:#fff;border-radius:16px;padding:20px;max-width:320px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2)}
#confirmBox h3{font-family:Fraunces,serif;font-size:1rem;color:var(--umber);margin:0 0 8px}
#confirmBox p{font-size:.85rem;color:var(--muted);margin:0 0 16px}
#confirmBox .actions{display:flex;gap:8px}
#confirmBox .actions button{flex:1;padding:10px;border-radius:999px;font-weight:700;font-size:.82rem}
.btn-danger{background:var(--terracotta);color:#fff}
.btn-cancel{background:var(--cream);color:var(--muted);border:1px solid var(--line)}
</style>
</head>
<body>

<!-- SESSION LIST -->
<div id="main">
  <div class="topbar">
    <div><div class="sub">onetoeight · AI</div><h1>Chat History</h1></div>
    <a href="index.html" class="btn-text">← App</a>
  </div>
  <div id="sessionList"></div>
</div>

<!-- CHAT VIEW -->
<div id="chatView">
  <div id="chatHeader">
    <button class="btn" onclick="closeChat()">←</button>
    <div><div class="sub" id="chatDate"></div><h1 id="chatTitle">Conversation</h1></div>
    <button class="btn" onclick="deleteCurrentSession()" style="font-size:.8rem">🗑</button>
  </div>
  <div id="chatMessages"></div>
</div>

<!-- CONFIRM DELETE -->
<div id="confirmOverlay">
  <div id="confirmBox">
    <h3>Delete this chat?</h3>
    <p>This removes it from your device. There is no undo.</p>
    <div class="actions">
      <button class="btn-cancel" onclick="cancelDelete()">Keep</button>
      <button class="btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
var STORAGE_KEY = 'onetoeight_ai_sessions';
var sessions = [];
var currentSessionId = null;
var pendingDeleteId = null;

function loadSessions(){
  try{ sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ sessions = []; }
  if(!Array.isArray(sessions)) sessions = [];
  // Sort newest first
  sessions.sort(function(a,b){ return new Date(b.started) - new Date(a.started); });
}
function saveSessions(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }

// ===== RENDER SESSION LIST =====
function renderSessionList(){
  loadSessions();
  var el = document.getElementById('sessionList');
  if(sessions.length === 0){
    el.innerHTML = '<div class="empty-state"><span class="icon">💬</span><h2>No chats yet</h2><p>Start a conversation with your AI guide in the app, then come back here to review your history.</p><a href="index.html" class="btn-primary">Open the app →</a></div>';
    return;
  }
  var h = '<h2>' + sessions.length + ' conversation' + (sessions.length!==1?'s':'') + '</h2>';
  for(var i=0;i<sessions.length;i++){
    var s = sessions[i];
    var firstUser = '';
    for(var j=0;j<s.messages.length;j++){
      if(s.messages[j].role === 'user'){ firstUser = s.messages[j].content; break; }
    }
    var date = new Date(s.started);
    var dateStr = date.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});
    var timeStr = date.toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'});
    var msgCount = s.messages.filter(function(m){return m.role==='user';}).length;
    h += '<div class="session-card" onclick="openChat(\'' + s.id + '\')">';
    h += '<button class="delete-btn" onclick="event.stopPropagation();promptDelete(\'' + s.id + '\')">×</button>';
    h += '<div class="date">' + dateStr + ' · ' + timeStr + '</div>';
    h += '<div class="preview">' + escapeHTML(firstUser || '(no messages)') + '</div>';
    h += '<div class="meta"><span>💬 ' + msgCount + ' question' + (msgCount!==1?'s':'') + '</span><span>📝 ' + s.messages.length + ' message' + (s.messages.length!==1?'s':'') + '</span></div>';
    h += '</div>';
  }
  el.innerHTML = h;
}

// ===== OPEN CHAT =====
function openChat(sessionId){
  currentSessionId = sessionId;
  var s = null;
  for(var i=0;i<sessions.length;i++){ if(sessions[i].id === sessionId){ s = sessions[i]; break; } }
  if(!s) return;

  var date = new Date(s.started);
  document.getElementById('chatDate').textContent = date.toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  document.getElementById('chatTitle').textContent = date.toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'});

  var msgs = document.getElementById('chatMessages');
  msgs.innerHTML = '';
  for(var i=0;i<s.messages.length;i++){
    var m = s.messages[i];
    var d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    var formatted = m.content.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    d.innerHTML = formatted;
    if(m.role === 'assistant'){
      var cb = document.createElement('button');
      cb.className = 'copy-btn';
      cb.textContent = 'Copy';
      cb.onclick = function(content){
        return function(e){ e.stopPropagation(); navigator.clipboard.writeText(content).then(function(){ this.textContent='Copied!'; setTimeout(function(){this.textContent='Copy';}.bind(this),1500); }.bind(this)); };
      }(m.content);
      d.appendChild(cb);
    }
    msgs.appendChild(d);
  }

  document.getElementById('main').style.display = 'none';
  document.getElementById('chatView').classList.add('active');
}

function closeChat(){
  currentSessionId = null;
  document.getElementById('chatView').classList.remove('active');
  document.getElementById('main').style.display = '';
}

// ===== DELETE =====
function promptDelete(sessionId){
  pendingDeleteId = sessionId;
  document.getElementById('confirmOverlay').classList.add('active');
}
function cancelDelete(){
  pendingDeleteId = null;
  document.getElementById('confirmOverlay').classList.remove('active');
}
function deleteCurrentSession(){
  if(currentSessionId) promptDelete(currentSessionId);
}

document.getElementById('confirmDeleteBtn').addEventListener('click', function(){
  if(!pendingDeleteId) return;
  sessions = sessions.filter(function(s){ return s.id !== pendingDeleteId; });
  saveSessions();
  if(currentSessionId === pendingDeleteId) closeChat();
  pendingDeleteId = null;
  document.getElementById('confirmOverlay').classList.remove('active');
  renderSessionList();
});

// ===== HELPERS =====
function escapeHTML(str){
  if(!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== INIT =====
renderSessionList();
</script>

</body>
</html>
